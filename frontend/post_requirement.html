                FabBridge
            </div>
            <div class="topbar-right">
                <input type="text" id="dashboardSearch" placeholder="Search...">
                <span class="profile">
                    👤 <span id="userName">User</span>
                </span>
            </div>
        </header>

        <aside class="sidebar" id="mainSidebar">
            <ul>
                <li class=" "><a href="customer-dashboard.html">🏠 Dashboard</a></li>

            </ul>

<div class="dashboard" id="dashboardLayout">
    <main class="content">
        

<div class="container">

    <div class="form-box">

        <h1>Post a Requirement</h1>
        <p>Fill in your manufacturing requirement details.</p>

        <form id="requirementForm">

            <div class="input-group">
                <label>Requirement Title</label>
                <input type="text" id="title" placeholder="Example: CNC Machining Parts" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="category">Manufacturing Category <span class="required-star">*</span></label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="CNC Machining">CNC Machining</option>
                        <option value="Sheet Metal & Fabrication">Sheet Metal & Fabrication</option>
                        <option value="Laser Cutting">Laser Cutting</option>
                        <option value="Injection Moulding">Injection Moulding</option>
                        <option value="3D Printing">3D Printing</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Mechanical Components">Mechanical Components</option>
                        <option value="Packaging">Packaging</option>
                        <option value="Other Manufacturing">Other Manufacturing</option>
                    </select>
                </div>

                <div class="input-group" id="subcategoryGroup">
                    <label for="subcategory">Subcategory <span class="sub-helper" id="subHelperText">(Select category first)</span></label>
                    <select id="subcategory" disabled>
                        <option value="">Select Category First</option>
                    </select>
                </div>
            </div>

            <div class="input-group">

                <label>Description</label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe your requirement..."
                    required></textarea>

            </div>

            <div class="row">

                <div class="input-group">

                    <label>Quantity</label>

                    <input type="number" id="quantity" required>

                </div>

                <div class="input-group">

                    <label>Budget (₹)</label>

                    <input type="number" id="budget" required>

                </div>

            </div>

            <div class="row">

                <div class="input-group">

                    <label>Deadline</label>

                    <input type="date" id="deadline" required>

                </div>

                <div class="input-group">

                    <label>Upload Drawing / Image</label>

                    <input type="file" id="drawing">

                </div>

            </div>

            <button type="submit" id="submitBtn">
                Submit Requirement
            </button>

        </form>

    </div>

</div>




    </main>
</div>

<script type="module" src="js/post_requirement.js"></script>
<script type="module" src="js/navigation.js"></script>

</body>

</html>
