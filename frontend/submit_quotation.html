<html lang="en">

<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/submit_quotation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<!-- =========================
     TOPBAR & SIDEBAR WILL BE INJECTED BY navigation.js
========================= -->

        <header class="topbar">
            <div class="logo">
                <span class="hamburger" id="hamburgerMenu">☰</span>
                FabBridge
            </div>
            <div class="topbar-right">
                <input type="text" id="dashboardSearch" placeholder="Search...">
                <span class="profile">
                    👤 <span id="userName">User</span>
                </span>
            </div>
        </header>

        <aside class="sidebar" id="mainSidebar">
            <ul>
                <li class=" "><a href="customer-dashboard.html">🏠 Dashboard</a></li>
                <li class=""><a href="tracking.html">🏭 Manufacturing Tracking</a></li>
                <li class=""><a href="marketplace.html">🌐 Marketplace</a></li>
                <li class=""><a href="projects.html">📋 My Requirements</a></li>
                <li class=""><a href="received-quotations.html">📨 Received Quotations</a></li>
                
                <li class=""><a href="notifications.html">🔔 Notifications <span id="notificationCount" class="notification-badge">0</span></a></li>
                
                
                <li class=""><a href="profile.html">👤 Profile</a></li>
                <li class=""><a href="settings.html">⚙️ Settings</a></li>
                <li><a href="#" id="logoutBtn">🚪 Logout</a></li>
            </ul>
        </aside>
    

<div class="dashboard" id="dashboardLayout">
    <main class="content">
        

<div class="container">

    <div class="form-box">

        <h1>Submit Quotation</h1>

        <p>
            Send your quotation for this business requirement.
        </p>


        <form id="quotationForm">


            <!-- YOUR COMPANY -->

            <div class="input-group">

                <label>Your Company</label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="Loading company..."
                    readonly
                    required>

            </div>


            <!-- REQUIREMENT OWNER -->

            <div class="input-group">

                <label>Requirement Owner Email</label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Loading..."
                    readonly
                    required>

            </div>


            <!-- REQUIREMENT -->

            <div class="input-group">

                <label>Requirement Title</label>

                <input
                    type="text"
                    id="requirementTitle"
                    placeholder="Loading requirement..."
                    readonly
                    required>

            </div>


            <!-- REQUIREMENT CATEGORY -->

            <div class="input-group">

                <label>Category</label>

                <input
                    type="text"
                    id="requirementCategory"
                    placeholder="Loading category..."
                    readonly>

            </div>


            <!-- REQUIREMENT DESCRIPTION -->

            <div class="input-group">

                <label>Requirement Description</label>

                <textarea
                    id="requirementDescription"
                    rows="4"
                    readonly
                    placeholder="Loading requirement..."></textarea>

            </div>


            <!-- PRICE -->

            <div class="input-group">

                <label>Quotation Price (₹)</label>

                <input
                    type="number"
                    id="price"
                    placeholder="Enter quotation amount"
                    min="1"
                    required>

            </div>


            <!-- DELIVERY -->

            <div class="input-group">

                <label>Delivery Time</label>

                <input
                    type="text"
                    id="delivery"
                    placeholder="Example: 7 Days"
                    required>

            </div>


          


            <!-- QUOTATION DESCRIPTION -->

            <div class="input-group">

                <label>Quotation Description</label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Explain your quotation, materials, service details, etc."
                    required></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitBtn">

                Submit Quotation

            </button>


        </form>

    </div>

</div>





    </main>
</div>

<script
    type="module"
    src="js/submit_quotation.js">
</script>
<script type="module" src="js/navigation.js"></script>

</body>

</html>
